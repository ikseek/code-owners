name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install .[dev]
      - name: Lint
        run: ./scripts/lint.sh
      - name: Run tests
        run: pytest -q
